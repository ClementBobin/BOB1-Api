name: 🧪 Unit tests

on:
  pull_request:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'CHANGELOG.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Bob1.slnx

      - name: Build
        run: dotnet build Bob1.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test Bob1.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore
